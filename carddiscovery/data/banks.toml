# Bill-payment apps (BBPS and others). Their email names the bank in its text ("your HDFC
# Bank credit card ending 2846 ..."), so it only counts when it names a bank and a card
# number, and when the app's own domain signed it. A card seen only in app email always goes
# to review: people pay family members' cards through these apps too.
# Each domain below was seen signing its own mail in a real inbox (2026-11).
[apps.cred]
name = "CRED"
domains = ["cred.club"]  # seen signed, 2026-11

