# Bank sender registry and card product aliases.
#
# `domains`: sender domains for this issuer. A sender matches if its domain equals
#   an entry or is a subdomain of it. Old domains stay here forever, because
#   historical mail still comes from them.
#   THESE ARE A STARTING SEED AND HAVE NOT BEEN CHECKED AGAINST REAL MAIL.
#   Run `carddiscovery senders` on a real inbox to see what each bank actually uses.
#
# `products`: canonical product name -> aliases. Matching is case-insensitive,
#   scoped to the bank, longest alias first, and only counts when the alias sits
#   next to the word "card" (so "Select" or "Gold" in a sentence does not match).
#   The canonical name itself is always tried as an alias.
#
# Families: a product whose name extends another's ("Regalia Gold", "Regalia First" after
#   "Regalia"; "MoneyBack+" after "MoneyBack") is a variant of it, worked out automatically.
#   When an email only matches the bare name, the variant is read from the same email if
#   it is written there loosely ("Regalia Gold statement", "REGALIA-GOLD", no "card" next
#   to it). To override one family, or switch it off with [], add for example:
#     [banks.hdfc.families]
#     "Regalia" = ["Regalia Gold", "Regalia First"]
#
# `catalog_issuers`: the card catalogue's issuer slugs (cards.issuer.slug) whose cards are
#   listed here. Products marked from the catalogue were merged from cards.card on 2026-11-19.
#   Co-branded SBI Card and OneCard cards sit under the issuer that sends their mail.


