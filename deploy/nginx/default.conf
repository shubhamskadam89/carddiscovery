# Frontend: the only container reachable from outside.
#   /                 the test page (a static file in this container: no data, no secrets)
#   /api/, /oauth/    forwarded to the backend (the engine) on the private network
# The backend accepts only requests whose Host is CD_PUBLIC_URL's host (or localhost), so the Host
# header is passed through.
#
# HTTPS on EC2: either put an AWS load balancer / Cloudflare in front (TLS there, this stays on 80), or
# mount certificates and use https.conf.example next to this file (see docs/deploy-docker.md).

upstream backend {
    server backend:8790;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 64k;            # the API takes small JSON bodies only
    server_tokens off;

    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
        # The page shows text that comes from bank emails: no outside scripts, frames or form posts.
        add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; form-action 'none'; base-uri 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Cache-Control no-store always;
    }

    location ~ ^/(api|oauth)/ {
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        return 404;
    }
}
