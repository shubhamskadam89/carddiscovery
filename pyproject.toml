[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carddiscovery"
version = "0.1.0"
description = "Discover the credit cards a user owns from their email history."
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# the mini server (cdserver): API, workers, Postgres queue, statement PDFs, resource monitor
server = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "psycopg[binary]>=3.2", "psycopg-pool>=3.2",
          "pypdf>=5", "psutil>=6"]
# Claude through the Anthropic API (CD_LLM_FALLBACK=api); the CLI backend needs only the `claude` command
llm = ["anthropic>=0.40"]

[project.scripts]
carddiscovery = "carddiscovery.cli:main"

[tool.setuptools.packages.find]
include = ["carddiscovery*", "cdserver*"]

[tool.setuptools.package-data]
carddiscovery = ["data/*.toml", "data/*.json", "data/*.html", "data/*.pem"]
cdserver = ["migrations/*.sql", "static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
